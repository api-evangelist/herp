aid: herp
name: HERP
description: 'HERP Inc. (株式会社HERP) is a Japanese HR Tech company whose mission is "採用を変え、日本を強く。"
  (change recruiting, strengthen Japan). It builds HERP Hire, an AI-era applicant tracking and recruitment
  management system (ATS) known for "scrum recruiting", alongside ジョブミル (Jobmill) for recruiting agents
  and HERP Career, a startup-focused job-change service. HERP Hire integrates with job boards and
  tools such as Zoom, Google Calendar and Slack, and exposes the "HERP Hire API" (generally available
  from 2026-02-03 to paying customers) for member assignment and application management. HERP was
  surfaced as a portfolio company of dcm-ventures and added to the API Evangelist network.'
